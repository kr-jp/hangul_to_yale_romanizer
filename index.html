<!doctype html>
  <html lang="ja" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hangul → Yale Romanizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets/logo/favicon.png">
  </head>
  <body>
    <header class="header">
      <h1 id="appTitle">한글 ↔ Yale</h1>
      <p class="sub" id="appSub">Yale romanization for Korean linguistics</p>
      <div class="direction-toggle" id="directionToggle" role="radiogroup" aria-label="Conversion direction">
        <button class="dir-btn active" data-dir="h2y" role="radio" aria-checked="true">한글 → Yale</button>
        <button class="dir-btn" data-dir="y2h" role="radio" aria-checked="false">Yale → 한글</button>
      </div>
      <div class="header-actions">
        <button id="openHist" class="btn btn-ghost" aria-controls="historyDrawer" aria-expanded="false"></button>
        <button id="openRef" class="btn btn-ghost" aria-controls="refDrawer" aria-expanded="false"></button>
        <button id="themeToggle" class="btn btn-ghost" aria-pressed="false" aria-label="Toggle theme"></button>
        <button id="langToggle" class="btn btn-ghost" aria-pressed="false" aria-label="Toggle language"></button>
        <a class="btn btn-ghost btn-icon" href="https://github.com/kr-jp/hangul_to_yale_romanizer" target="_blank" rel="noopener" aria-label="GitHub repository" title="GitHub">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.18-.02-2.14-3.2.7-3.87-1.36-3.87-1.36-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.24 3.34.95.1-.74.4-1.24.72-1.53-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18.91-.25 1.89-.38 2.86-.39.97.01 1.95.14 2.86.39 2.18-1.49 3.14-1.18 3.14-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.05.78 2.12 0 1.53-.01 2.77-.01 3.14 0 .31.21.67.8.55C20.71 21.39 24 17.07 24 12 24 5.65 18.85.5 12 .5z"/></svg>
        </a>
      </div>
    </header>

    <main class="container">
      <section class="panel panel-main">
        <div class="textarea-row">
          <div class="textarea-col">
            <label for="input" id="labelInput" class="label">入力（ハングル）</label>
            <textarea id="input" class="textarea" placeholder="입력 대기 중" rows="5"></textarea>
            <p id="hintY2H" class="hint hidden"></p>
          </div>
          <div class="textarea-col">
            <label for="output" id="labelOutput" class="label"></label>
            <textarea id="output" class="textarea" rows="5" readonly></textarea>
          </div>
        </div>

        <div class="controls">
          <label class="switch">
            <input id="labialRule" type="checkbox" checked />
            <span class="slider" aria-hidden="true"></span>
            <span id="labelLabial" class="switch-label"></span>
          </label>

          <!-- 인터리니어 스위치 -->
          <label class="switch">
            <input id="interlinearMode" type="checkbox" checked />
            <span class="slider" aria-hidden="true"></span>
            <span id="labelInterlinear" class="switch-label"></span>
          </label>

          <!-- 예문 번호 매기기 스위치 -->
          <label class="switch">
            <input id="exampleNumbering" type="checkbox" />
            <span class="slider" aria-hidden="true"></span>
            <span id="labelExampleNum" class="switch-label"></span>
          </label>

          <!-- 구분자 활성화 스위치 -->
          <label class="switch">
            <input id="sepEnable" type="checkbox" />
            <span class="slider" aria-hidden="true"></span>
            <span id="labelSep" class="switch-label"></span>
          </label>

          <!-- 구분자 설정 (비활성 시 숨김) -->
          <div id="sepControls" class="sep-controls hidden">
            <label class="control">
              <input id="separator" class="sep-input" type="text" maxlength="1" list="sepOptions" />
              <datalist id="sepOptions">
                <option value="" label=""></option>
                <option value=" " label="スペース"></option>
                <option value="-" label="ハイフン"></option>
                <option value="·" label="中黒"></option>
                <option value="." label="ピリオド"></option>
                <option value="/" label="スラッシュ"></option>
              </datalist>
              <span class="sep-preview" id="sepPreview" aria-hidden="true">∅</span>
            </label>
            <div class="chips" id="sepChips" role="group" aria-label="separator options">
              <button class="chip" data-sep="">∅</button>
              <button class="chip" data-sep=" ">␣</button>
              <button class="chip" data-sep="·">·</button>
              <button class="chip" data-sep="-">-</button>
              <button class="chip" data-sep=".">.</button>
              <button class="chip" data-sep="/">/</button>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="copyBtn" class="btn"></button>
          <button id="downloadBtn" class="btn btn-outline" type="button" aria-label="Download result">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><path d="M12 3v12M6 11l6 6 6-6M5 21h14"/></svg>
            <span id="labelDownload"></span>
          </button>
          <button id="backupBtn" class="btn btn-ghost" type="button" aria-label="Backup full state as JSON" title="">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg>
            <span id="labelBackup"></span>
          </button>
          <div class="format-group">
            <span id="labelFormat" class="format-label"></span>
            <div class="chips" id="formatChips" role="group" aria-label="output format">
              <button class="chip active" data-format="plain" type="button">Plain</button>
              <button class="chip" data-format="gloss" type="button">Gloss</button>
              <button class="chip" data-format="latex" type="button">LaTeX</button>
              <button class="chip" data-format="markdown" type="button">Markdown</button>
            </div>
          </div>
          <button id="shareBtn" class="btn btn-outline" type="button" style="margin-left:auto" aria-label="Share URL">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
            <span id="labelShare"></span>
          </button>
          <span id="status" class="status" aria-live="polite"></span>
        </div>
      </section>

      <section id="interlinearPanel" class="panel hidden" aria-hidden="true">
        <div id="ttlInterlinear" class="panel-title"></div>
        <div id="interlinear" class="interlinear"></div>
        <p id="hintInterlinear" class="hint"></p>
      </section>
    </main>

    <footer class="footer">
      <small>© 2026 <a href="https://researchmap.jp/jp-kr" target="_blank" rel="noopener">Seo Mincheol</a>. All rights reserved.</small>
    </footer>
    
    <!-- 예일식 참조 드로어 -->
    <aside id="refDrawer" class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div id="ttlRef" class="drawer-title"></div>
        <button id="closeRef" class="btn btn-ghost"></button>
      </div>
      <div id="refBody" class="drawer-body">
        <!-- JS가 매핑 테이블을 렌더링 -->
      </div>
    </aside>

    <!-- 히스토리 드로어 -->
    <aside id="historyDrawer" class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div id="ttlHist" class="drawer-title"></div>
        <div class="drawer-tools">
          <button id="clearHist" class="btn btn-ghost"></button>
          <button id="closeHist" class="btn btn-ghost"></button>
        </div>
      </div>
      <div class="hist-filters">
        <input id="histSearch" type="search" class="hist-search-input" />
        <div id="histTagFilter" class="hist-tag-filter"></div>
      </div>
      <div id="histList" class="drawer-body history-list">
        <!-- JS가 이력 렌더링 -->
      </div>
    </aside>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
    <div id="backdrop" class="backdrop" hidden></div>
  </body>
</html>
